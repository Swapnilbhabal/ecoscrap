<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#061a13;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js" } }</script></head><body>
<canvas id="c" width="1280" height="720" style="width:1280px;height:720px"></canvas>
<script type="module">
import { THREE, makeRenderer, environment, phone, laptop, battery, chip, charger, M, dotTexture } from "/js/three-kit.js";
const canvas = document.getElementById("c");
const r = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(1280, 720, false);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.95;
const scene = new THREE.Scene();
scene.environment = environment(r);
scene.fog = new THREE.Fog(0x061a13, 8, 17);
scene.background = new THREE.Color(0x061a13);
const cam = new THREE.PerspectiveCamera(32, 1280 / 720, 0.1, 100);
const key = new THREE.DirectionalLight(0xffd2a8, 2.0); key.position.set(-5, 6, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0x7be0a5, 1.6); rim.position.set(6, 3, -6); scene.add(rim);
scene.add(new THREE.AmbientLight(0x224433, 0.7));
const glow = new THREE.PointLight(0xd2793a, 6, 8, 2); glow.position.set(2.2, 0.9, 1.2); scene.add(glow);

// ground
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: 0x061510, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);

// deterministic random
let s = 11; const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
const deadGlass = new THREE.MeshPhysicalMaterial({ color: 0x0b1411, metalness: 0.2, roughness: 0.15, clearcoat: 1 });
const lap = () => { const g = laptop(); g.userData.kind = "laptop"; return g; };
const makers = [phone, phone, phone, phone, lap, battery, battery, chip, chip, chip, charger];
const heap = new THREE.Group(); heap.position.x = 2.2; scene.add(heap);
for (let i = 0; i < 170; i++) {
  const o = makers[Math.floor(rnd() * makers.length)]();
  const a = rnd() * Math.PI * 2, d = Math.pow(rnd(), 0.6) * 3.6;
  const h = Math.max(0, 1.45 - d * 0.42) * (0.55 + rnd() * 0.5);
  o.position.set(Math.cos(a) * d, h + 0.08, Math.sin(a) * d * 0.8);
  o.rotation.set(rnd() * 6.28, rnd() * 6.28, rnd() * 6.28);
  o.scale.setScalar((o.userData.kind === "laptop" ? 0.32 : 0.42) + rnd() * 0.22);
  // dead devices: screens off
  o.traverse((m) => { if (m.isMesh && m.material && m.material.emissiveMap) m.material = deadGlass; });
  heap.add(o);
}
// floating dust / recovered-metal motes on periodic paths (loop seamlessly)
const N = 420, geo = new THREE.BufferGeometry(), pos = new Float32Array(N * 3), seeds = [];
for (let i = 0; i < N; i++) seeds.push([rnd() * 8 - 4, rnd() * 3.2, rnd() * 6 - 3, rnd() * 6.28, 0.3 + rnd() * 0.7]);
geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
const motes = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.05, color: 0xe9b949, map: dotTexture(), transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(motes);

const T = 8; // seconds per loop
window.renderAt = (t) => {
  const p = (t % T) / T, w = p * Math.PI * 2;
  cam.position.set(Math.sin(w) * 1.3 + 0.6, 2.0 + Math.sin(w * 2) * 0.1, 9.6 + Math.cos(w) * 0.5);
  cam.lookAt(0.6, 0.6, 0);
  seeds.forEach(([x, y, z, ph, sp], i) => {
    pos[i * 3] = x + Math.sin(w + ph) * 0.25;
    pos[i * 3 + 1] = y + Math.sin(w * 2 * Math.round(sp * 2 + 1) / 2 + ph) * 0.18 + 0.2;
    pos[i * 3 + 2] = z + Math.cos(w + ph) * 0.25;
  });
  geo.attributes.position.needsUpdate = true;
  glow.intensity = 5 + Math.sin(w * 2) * 1.5;
  r.render(scene, cam);
};
window.renderAt(0);
window.ready = true;
</script></body></html>
