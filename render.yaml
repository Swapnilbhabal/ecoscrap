services:
  - type: web
    name: ecoscrap
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: COLLECTOR_PIN
        value: "2468"
      - key: ADMIN_PIN
        value: "9090"
